services:
  workshop-atlas:
    build: .
    restart: unless-stopped
    ports:
      - "${WORKSHOP_PORT:-3000}:3000"
    environment:
      NITRO_DATA_DIR: /data
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      # Optional. When set, creating the first administrator requires this key.
      # Leave it empty only on a host nobody else can reach before setup finishes.
      NITRO_SETUP_KEY: "${WORKSHOP_SETUP_KEY:-}"
    volumes:
      - workshop-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  workshop-data:
