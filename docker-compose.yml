services:
  workshop-atlas:
    build: .
    restart: unless-stopped
    ports:
      - "${WORKSHOP_PORT:-3000}:3000"
    environment:
      NITRO_DATA_DIR: /data
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      # Optional default for the Autodata VM shortcut (Settings can override it).
      NITRO_VM_URL: "${WORKSHOP_VM_URL:-}"
      # Optional. When set, creating the first administrator requires this key.
      # Leave it empty only on a host nobody else can reach before setup finishes.
      NITRO_SETUP_KEY: "${WORKSHOP_SETUP_KEY:-}"
      # Optional Gemini lookup (see DEPLOYMENT.md). Empty disables the buttons.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.8-flash}"
      GEMINI_TIMEOUT_MS: "${GEMINI_TIMEOUT_MS:-60000}"
      # Optional repair-time provider (see DEPLOYMENT.md). Empty disables lookups.
      REPAIR_API_URL: "${REPAIR_API_URL:-}"
      REPAIR_API_KEY: "${REPAIR_API_KEY:-}"
      REPAIR_API_TIMEOUT_MS: "${REPAIR_API_TIMEOUT_MS:-5000}"
      # Optional Groq browser-search torque lookup (see DEPLOYMENT.md).
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-20b}"
      GROQ_TIMEOUT_MS: "${GROQ_TIMEOUT_MS:-60000}"
    volumes:
      - workshop-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  tls:
    # Browsers only offer the camera on a secure origin, so the licence-disk
    # scanner's live view needs https. Caddy signs this host from its own local
    # authority; trust that root certificate once per device (DEPLOYMENT.md).
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - workshop-atlas
    ports:
      - "${WORKSHOP_TLS_PORT:-3443}:3443"
    environment:
      WORKSHOP_TLS_HOST: "${WORKSHOP_TLS_HOST:-localhost}"
      WORKSHOP_TLS_PORT: "${WORKSHOP_TLS_PORT:-3443}"
    # The Caddyfile is written at start-up rather than bind-mounted: a stack
    # pasted into a management UI has no repository files beside its compose file.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/caddy/Caddyfile <<'CADDY'
        {
            # A browser opening an IP address sends no SNI, so Caddy needs a
            # default name to pick the certificate for those connections.
            default_sni {$$WORKSHOP_TLS_HOST}
        }

        {$$WORKSHOP_TLS_HOST}:{$$WORKSHOP_TLS_PORT} {
            tls internal
            encode zstd gzip
            reverse_proxy workshop-atlas:3000
        }
        CADDY
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  # Keep this volume: it holds the authority that signs the certificate. Losing
  # it issues a new one and every device has to trust the new root again.
  caddy-data:
  caddy-config:
  workshop-data:
