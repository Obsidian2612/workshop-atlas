services:
  workshop-atlas:
    build: .
    restart: unless-stopped
    ports:
      - "${WORKSHOP_PORT:-3000}:3000"
    environment:
      NITRO_DATA_DIR: /data
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      # Optional default for the Autodata VM shortcut (Settings can override it).
      NITRO_VM_URL: "${WORKSHOP_VM_URL:-}"
      # Optional. When set, creating the first administrator requires this key.
      # Leave it empty only on a host nobody else can reach before setup finishes.
      NITRO_SETUP_KEY: "${WORKSHOP_SETUP_KEY:-}"
      # Optional repair-time provider (see DEPLOYMENT.md). Empty disables lookups.
      REPAIR_API_URL: "${REPAIR_API_URL:-}"
      REPAIR_API_KEY: "${REPAIR_API_KEY:-}"
      REPAIR_API_TIMEOUT_MS: "${REPAIR_API_TIMEOUT_MS:-5000}"
      # Optional online torque search (see DEPLOYMENT.md). Empty disables the button.
      TORQUE_SEARCH_URL: "${TORQUE_SEARCH_URL:-}"
      TORQUE_SEARCH_PROVIDER: "${TORQUE_SEARCH_PROVIDER:-generic}"
      TORQUE_SEARCH_KEY: "${TORQUE_SEARCH_KEY:-}"
      TORQUE_SEARCH_ENGINE_ID: "${TORQUE_SEARCH_ENGINE_ID:-}"
    volumes:
      - workshop-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  workshop-data:
